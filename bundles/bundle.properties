block.graphite-press-gen.name = Graphite Generator
block.graphite-press-gen.description = High-pressure thermal compression of airborne carbon into dense graphite.\nProduces graphite from power alone. Requires multi-press and coal generator.
block.silicon-smelter-gen.name = Silicon Generator
block.silicon-smelter-gen.description = Electric arc reduction of silicate dust into purified silicon wafers.\nProduces silicon from power alone. Requires silicon crucible and sand generator.
block.metaglass-gen.name = Metaglass Generator
block.metaglass-gen.description = Molten glass synthesis from airborne silicate and metal fumes.\nProduces metaglass from power alone. Requires kiln and lead generator.
block.plastanium-gen.name = Plastanium Generator
block.plastanium-gen.description = Plasma-infused titanium compaction into lightweight plastanium sheets.\nProduces plastanium from power alone. Requires plastanium compressor and titanium generator.
block.phase-fabric-gen.name = Phase Fabric Generator
block.phase-fabric-gen.description = Irradiated thorium weave into phase-shifting fabric sheets.\nProduces phase fabric from power alone. Requires phase weaver and thorium generator.
block.pyratite-gen.name = Pyratite Generator
block.pyratite-gen.description = Exothermic catalysis of airborne phosphite compounds into volatile pyratite.\nProduces pyratite from power alone. Requires pyratite mixer and coal generator.
block.blast-compound-gen.name = Blast Compound Generator
block.blast-compound-gen.description = Stable detonation compound synthesis from atmospheric precursors.\nProduces blast compound from power alone. Requires blast mixer and coal generator.
block.surge-alloy-gen.name = Surge Alloy Generator
block.surge-alloy-gen.description = Multi-metal plasma fusion into surge-alloy ingots.\nProduces surge alloy from power alone. Requires alloy smelter and copper generator.
