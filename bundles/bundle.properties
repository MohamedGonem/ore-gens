block.copper-gen.name = Copper Generator
block.copper-gen.description = Electrodeposition of airborne copper onto charged cathodes.\nPower: 3 power/sec, 1.0/min.
block.copper-gen-unpowered.name = Copper Generator (Passive)
block.copper-gen-unpowered.description = A copper condenser that passively accretes trace copper dust from the air.\nNo power required, but heavy and slow. Expensive to build. 0.4/min.
block.copper-gen-water.name = Copper Liquid Generator
block.copper-gen-water.description = Electrowinning recovers copper ions dissolved in the feed liquid.\nConsumes water: 1/sec. No power required. 1.5/min.
block.copper-gen-cryo.name = Copper Cryo Generator
block.copper-gen-cryo.description = Cryogenic crystallization forces dissolved copper out of suspension as cathodes.\nThe fastest generator type. Needs power and cryofluid. 2.0/min.

block.lead-gen.name = Lead Generator
block.lead-gen.description = Gravity precipitation of airborne lead oxide fumes into ingots.\nPower: 3 power/sec, 1.0/min.
block.lead-gen-unpowered.name = Lead Generator (Passive)
block.lead-gen-unpowered.description = A settling chamber that lets heavy lead dust slowly fall out of the air.\nNo power required, but heavy and slow. Expensive to build. 0.4/min.
block.lead-gen-water.name = Lead Liquid Generator
block.lead-gen-water.description = Dense-media separation recovers lead from the feed liquid.\nConsumes water: 1/sec. No power required. 1.5/min.
block.lead-gen-cryo.name = Lead Cryo Generator
block.lead-gen-cryo.description = Cryo-densification forces lead out of suspension as heavy crystalline masses.\nThe fastest generator type. Needs power and cryofluid. 2.0/min.

block.coal-gen.name = Coal Generator
block.coal-gen.description = Thermal carbon scrubbers fix airborne hydrocarbons into coal.\nPower: 3 power/sec, 1.0/min.
block.coal-gen-unpowered.name = Coal Generator (Passive)
block.coal-gen-unpowered.description = A slow-burning kiln that accumulates airborne soot into crude coal.\nNo power required, but heavy and slow. Expensive to build. 0.4/min.
block.coal-gen-water.name = Coal Liquid Generator
block.coal-gen-water.description = Slurry separation recovers carbon suspended in the feed liquid.\nConsumes water: 1/sec. No power required. 1.5/min.
block.coal-gen-cryo.name = Coal Cryo Generator
block.coal-gen-cryo.description = Cryogenic condensation deposits volatile carbon as solid coal.\nThe fastest generator type. Needs power and cryofluid. 2.0/min.

block.titanium-gen.name = Titanium Generator
block.titanium-gen.description = Plasma reduction of airborne titanium chloride vapor into metal.\nPower: 4 power/sec, 0.9/min.
block.titanium-gen-unpowered.name = Titanium Generator (Passive)
block.titanium-gen-unpowered.description = A chemical reactor that slowly reduces titanium-bearing dust from the air.\nNo power required, but heavy and slow. Expensive to build. 0.4/min.
block.titanium-gen-water.name = Titanium Liquid Generator
block.titanium-gen-water.description = Solvent extraction recovers titanium ions from the feed liquid.\nConsumes water: 1.1/sec. No power required. 1.2/min.
block.titanium-gen-cryo.name = Titanium Cryo Generator
block.titanium-gen-cryo.description = Cryogenic vapor deposition forces titanium out of suspension as crystals.\nThe fastest generator type. Needs power and cryofluid. 1.7/min.

block.scrap-gen.name = Scrap Generator
block.scrap-gen.description = Magnetic separation sifts ferrous scrap from airborne dust.\nPower: 2 power/sec, 1.2/min.
block.scrap-gen-unpowered.name = Scrap Generator (Passive)
block.scrap-gen-unpowered.description = A magnet bed that slowly pulls iron filings out of the air.\nNo power required, but heavy and slow. Expensive to build. 0.5/min.
block.scrap-gen-water.name = Scrap Liquid Generator
block.scrap-gen-water.description = Magnetic filtration recovers ferrous scrap from the feed liquid.\nConsumes water: 0.9/sec. No power required. 1.8/min.
block.scrap-gen-cryo.name = Scrap Cryo Generator
block.scrap-gen-cryo.description = Cryo-brittling fractures trapped metal into clean scrap.\nThe fastest generator type. Needs power and cryofluid. 2.4/min.

block.thorium-gen.name = Thorium Generator
block.thorium-gen.description = Irradiation chambers transmute trace thorium from airborne dust.\nPower: 5 power/sec, 0.6/min.
block.thorium-gen-unpowered.name = Thorium Generator (Passive)
block.thorium-gen-unpowered.description = A shielded hopper that gradually collects radioactive thorium dust.\nNo power required, but heavy and slow. Expensive to build. 0.2/min.
block.thorium-gen-water.name = Thorium Liquid Generator
block.thorium-gen-water.description = Acid leaching recovers thorium from the feed liquid.\nConsumes water: 1.3/sec. No power required. 0.8/min.
block.thorium-gen-cryo.name = Thorium Cryo Generator
block.thorium-gen-cryo.description = Cryogenic quenching forces thorium out of suspension as dense rods.\nThe fastest generator type. Needs power and cryofluid. 1.1/min.

block.sand-gen.name = Sand Generator
block.sand-gen.description = Cyclonic sieving separates silica from airborne grit.\nPower: 2 power/sec, 1.2/min.
block.sand-gen-unpowered.name = Sand Generator (Passive)
block.sand-gen-unpowered.description = A wind winnower that settles sand grains out of the air.\nNo power required, but heavy and slow. Expensive to build. 0.5/min.
block.sand-gen-water.name = Sand Liquid Generator
block.sand-gen-water.description = Hydrocyclone separation recovers sand from the feed liquid.\nConsumes water: 0.9/sec. No power required. 1.8/min.
block.sand-gen-cryo.name = Sand Cryo Generator
block.sand-gen-cryo.description = Frost agglomeration forces sand out of suspension as grains.\nThe fastest generator type. Needs power and cryofluid. 2.4/min.

block.beryllium-gen.name = Beryllium Generator
block.beryllium-gen.description = Electrolytic extraction of beryllium from airborne beryl dust.\nPower: 3 power/sec, 1.0/min.
block.beryllium-gen-unpowered.name = Beryllium Generator (Passive)
block.beryllium-gen-unpowered.description = A chemical scrubber that slowly collects beryllium-bearing dust.\nNo power required, but heavy and slow. Expensive to build. 0.4/min.
block.beryllium-gen-water.name = Beryllium Liquid Generator
block.beryllium-gen-water.description = Solvent extraction recovers beryllium from the feed liquid.\nConsumes ozone: 1/sec. No power required. 1.5/min.
block.beryllium-gen-cryo.name = Beryllium Cryo Generator
block.beryllium-gen-cryo.description = Cryogenic precipitation forces beryllium out of suspension as crystals.\nThe fastest generator type. Needs power and cryofluid. 2.0/min.

block.tungsten-gen.name = Tungsten Generator
block.tungsten-gen.description = Arc furnace reduction of airborne tungsten ore into metal.\nPower: 5 power/sec, 0.7/min.
block.tungsten-gen-unpowered.name = Tungsten Generator (Passive)
block.tungsten-gen-unpowered.description = A refractory condenser that slowly gathers tungsten dust.\nNo power required, but heavy and slow. Expensive to build. 0.3/min.
block.tungsten-gen-water.name = Tungsten Liquid Generator
block.tungsten-gen-water.description = Pressure leaching recovers tungsten from the feed liquid.\nConsumes ozone: 1.2/sec. No power required. 0.9/min.
block.tungsten-gen-cryo.name = Tungsten Cryo Generator
block.tungsten-gen-cryo.description = Cryo-sintering forces tungsten out of suspension as dense crystals.\nThe fastest generator type. Needs power and cryofluid. 1.2/min.

